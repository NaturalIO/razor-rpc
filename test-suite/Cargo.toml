[package]
name = "razor-rpc-test"
edition = "2024"

[[bench]]
name = "grpc_compare"
harness = false

[dependencies]
serde = "1"
serde_derive = "1"
razor-stream = {path="../stream/", version="0"}
orb = { version = "0" }
orb-tokio = { version = "0", optional=true}
orb-smol = { version = "0", features=["global"], optional=true}
razor-rpc-tcp = {path="../transport/tcp", version="0"}
razor-rpc-codec = {path="../codec", version="0", features=["msgpack"]}
razor-rpc = {path="../", version="0"}
log = { version = "0.4", features = ["std", "kv_unstable"] }
captains-log = ">=0.15"
crossfire = "3.0"
tokio = { version = "1", features = ["net", "time", "rt", "rt-multi-thread"], optional=true }
smol = {version = "2", optional=true }
io-buffer = { version = "1.0.7", features = ["rand"] }
parking_lot = "0.12"
rstest = "0"
nix = "0"
async-trait = "0"

# gRPC dependencies
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
tokio-stream = { version = "0.1", optional = true }

# Benchmark framework
criterion = { version = "0.8", features = ["async_tokio"], optional = true }

[build-dependencies]
tonic-build = { version = "0.12", optional = true }

[dev-dependencies]

[features]
default = ["smol"]
tokio = ["dep:tokio", "dep:orb-tokio", "dep:tonic", "dep:prost", "dep:tokio-stream", "dep:criterion", "dep:tonic-build"]
smol = ["dep:smol", "dep:orb-smol"]

