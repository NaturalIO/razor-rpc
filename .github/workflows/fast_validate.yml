name: fast-validate
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: clippy 
      run: make clippy

    - name: test codec
      run: make test-codec

    - name: test stream
      run: make test-stream

    - name: test api
      run: make test-api

    - name: test smol
      run: make test "basic -F smol"

    - name: test tokio
      run: make test "basic -F tokio"
